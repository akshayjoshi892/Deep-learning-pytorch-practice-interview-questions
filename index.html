<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>350 Deep Learning & PyTorch Interview Questions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #171b26;
        --surface2: #1e2436;
        --border: #2a3050;
        --border2: #3a4570;
        --text: #e8eaf0;
        --text2: #8b93b0;
        --text3: #5a6280;
        --accent: #4ade80;
        --accent2: #22c55e;
        --mono: "JetBrains Mono", monospace;
        --sans: "Sora", sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
        min-height: 100vh;
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 99px;
      }

      /* layout */
      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 17, 23, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
      }
      .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .logo {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      .badge {
        background: #1a2d1a;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        border: 1px solid #2a4a2a;
      }
      .search-wrap {
        flex: 1;
        min-width: 200px;
        position: relative;
      }
      .search-wrap input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px 8px 36px;
        color: var(--text);
        font-family: var(--sans);
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-wrap input:focus {
        border-color: var(--border2);
      }
      .search-wrap input::placeholder {
        color: var(--text3);
      }
      .search-icon {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text3);
        font-size: 15px;
        pointer-events: none;
      }
      .view-btns {
        display: flex;
        gap: 6px;
      }
      .view-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text2);
        font-family: var(--sans);
        font-size: 12px;
        padding: 6px 14px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .view-btn.active,
      .view-btn:hover {
        border-color: var(--border2);
        color: var(--text);
        background: var(--surface2);
      }

      /* progress bar */
      .progress-bar {
        height: 3px;
        background: var(--surface2);
        width: 100%;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #4ade80);
        border-radius: 99px;
        transition: width 0.4s ease;
      }

      /* main */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }

      /* sidebar */
      .sidebar {
        width: 220px;
        flex-shrink: 0;
        position: sticky;
        top: 70px;
        max-height: calc(100vh - 90px);
        overflow-y: auto;
      }
      .sidebar-section {
        margin-bottom: 20px;
      }
      .sidebar-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--text3);
        text-transform: uppercase;
        margin-bottom: 8px;
        padding: 0 4px;
      }
      .sidebar-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        text-align: left;
        font-family: var(--sans);
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all 0.15s;
        background: transparent;
        color: var(--text2);
        gap: 6px;
      }
      .sidebar-btn:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .sidebar-btn.active {
        background: var(--surface2);
        color: var(--text);
        font-weight: 500;
      }
      .sidebar-btn .count {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text3);
        flex-shrink: 0;
      }
      .sidebar-btn .done-count {
        color: var(--accent);
        font-family: var(--mono);
        font-size: 11px;
      }
      .tag-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      /* filter chips */
      .filter-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        padding: 5px 11px;
        border-radius: 99px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.15s;
        font-family: var(--sans);
      }
      .chip:hover {
        border-color: var(--border2);
        color: var(--text);
      }
      .chip.on {
        border-color: #2a4a2a;
        background: #1a2d1a;
        color: var(--accent);
      }
      .chip.clear {
        border-color: var(--border);
        color: var(--text3);
      }
      .chip.clear:hover {
        color: var(--text);
        border-color: var(--border2);
      }

      /* question list */
      .q-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }
      .q-count {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text3);
        margin-bottom: 12px;
      }

      /* question card */
      .q-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      .q-card:hover {
        border-color: var(--border2);
      }
      .q-card.done {
        border-color: #1a3a1a;
      }
      .q-card.done .q-num {
        color: var(--accent);
      }
      .q-header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        cursor: pointer;
        user-select: none;
      }
      .q-num {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text3);
        min-width: 30px;
        padding-top: 2px;
      }
      .q-body {
        flex: 1;
        min-width: 0;
      }
      .q-tags {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 7px;
      }
      .tag-pill {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 99px;
        white-space: nowrap;
      }
      .sec-pill {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--surface2);
        color: var(--text3);
        border: 1px solid var(--border);
      }
      .lvl-pill {
        font-size: 10px;
        font-family: var(--mono);
        padding: 2px 7px;
        border-radius: 99px;
        border: 1px solid var(--border);
        color: var(--text3);
      }
      .q-text {
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--text);
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .q-text.expanded {
        display: block;
        -webkit-line-clamp: unset;
      }
      .q-actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        padding-top: 2px;
      }
      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        padding: 3px;
        border-radius: 4px;
        transition: all 0.15s;
        color: var(--text3);
        line-height: 1;
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .icon-btn.bmk.on {
        color: #f59e0b;
      }
      .icon-btn.done-btn.on {
        color: var(--accent);
      }

      /* stats */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text3);
        margin-bottom: 6px;
        font-family: var(--mono);
        letter-spacing: 0.05em;
      }
      .stat-value {
        font-size: 26px;
        font-weight: 500;
        color: var(--text);
        font-family: var(--mono);
      }
      .stat-value.green {
        color: var(--accent);
      }
      .section-card,
      .tag-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .section-card h3,
      .tag-card h3 {
        font-size: 13px;
        font-weight: 500;
        color: var(--text2);
        margin-bottom: 16px;
        font-family: var(--mono);
      }
      .prog-row {
        margin-bottom: 12px;
      }
      .prog-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .prog-name {
        font-size: 12px;
        color: var(--text2);
      }
      .prog-nums {
        font-size: 11px;
        color: var(--text3);
        font-family: var(--mono);
      }
      .prog-track {
        background: var(--surface2);
        border-radius: 99px;
        height: 5px;
      }
      .prog-fill {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #16a34a, #4ade80);
        transition: width 0.4s;
      }
      .tag-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .tag-bar-track {
        flex: 2;
        background: var(--surface2);
        border-radius: 99px;
        height: 6px;
      }
      .tag-bar-fill {
        height: 100%;
        border-radius: 99px;
      }
      .tag-name {
        flex: 1;
        font-size: 12px;
        color: var(--text2);
      }
      .tag-num {
        font-size: 11px;
        font-family: var(--mono);
        color: var(--text3);
        min-width: 24px;
        text-align: right;
      }

      /* empty */
      .empty {
        text-align: center;
        padding: 48px;
        color: var(--text3);
        font-size: 13px;
      }

      /* header block */
      .hero {
        padding: 32px 24px 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .hero h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin-bottom: 6px;
      }
      .hero h1 span {
        color: var(--accent);
      }
      .hero p {
        font-size: 13px;
        color: var(--text3);
        margin-bottom: 16px;
      }
      .progress-meta {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text3);
        margin-top: 5px;
      }

      @media (max-width: 768px) {
        .sidebar {
          display: none;
        }
        .main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="topbar-inner">
          <span class="logo">PyTorch.interview</span>
          <span class="badge">350 questions</span>
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="search"
              placeholder="Search questions, topics, types…"
              oninput="render()"
            />
          </div>
          <div class="view-btns">
            <button
              class="view-btn active"
              id="btn-q"
              onclick="switchView('questions')"
            >
              Questions
            </button>
            <button class="view-btn" id="btn-s" onclick="switchView('stats')">
              Progress
            </button>
          </div>
        </div>
      </div>

      <div class="hero">
        <h1>Deep Learning &amp; <span>PyTorch</span> Interview Questions</h1>
        <p>
          350 questions · 11 sections · L1 to L4 difficulty · from first
          principles to production engineering
        </p>
        <div class="progress-bar">
          <div class="progress-fill" id="prog-fill" style="width: 0%"></div>
        </div>
        <div class="progress-meta">
          <span id="prog-label">0 of 350 completed</span>
          <span id="bmk-label">0 bookmarked</span>
        </div>
      </div>

      <div class="main">
        <!-- sidebar -->
        <div class="sidebar" id="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-label">Sections</div>
            <button
              class="sidebar-btn active"
              id="sec-all"
              onclick="setSection(null)"
            >
              <span>All sections</span><span class="count">350</span>
            </button>
            <div id="sec-list"></div>
          </div>
          <div class="sidebar-section">
            <div class="sidebar-label">Question type</div>
            <div id="tag-list"></div>
          </div>
        </div>

        <!-- content -->
        <div style="flex: 1; min-width: 0">
          <div id="filter-row" class="filter-row"></div>
          <div id="q-count" class="q-count"></div>
          <div id="q-list" class="q-list"></div>
          <div id="stats-view" style="display: none"></div>
        </div>
      </div>
    </div>

    <script>
      const SECTIONS = [
        "PyTorch Core & Internals",
        "ANN & Feedforward Networks",
        "Convolutional Neural Networks",
        "Recurrent Neural Networks",
        "Attention & Transformers",
        "Optimization Deep Dive",
        "Loss Functions & Objectives",
        "Training Techniques & Best Practices",
        "Generative Models",
        "LLM / NLP Engineering",
        "Production & MLOps",
      ];

      const TAGS = [
        "Theory",
        "Math / Proof",
        "Implement",
        "Debug / Diagnose",
        "Design",
        "Explain Behavior",
        "Optimize",
        "Comparison",
      ];

      const TAG_STYLE = {
        Theory: { bg: "#1e3a5f", color: "#7dd3fc", border: "#1e4a7f" },
        "Math / Proof": { bg: "#2d1b69", color: "#c4b5fd", border: "#3d2a80" },
        Implement: { bg: "#14401a", color: "#86efac", border: "#1a5520" },
        "Debug / Diagnose": {
          bg: "#4a1515",
          color: "#fca5a5",
          border: "#5a2020",
        },
        Design: { bg: "#422006", color: "#fcd34d", border: "#5a3010" },
        "Explain Behavior": {
          bg: "#0f3d30",
          color: "#6ee7b7",
          border: "#145040",
        },
        Optimize: { bg: "#3d1a3a", color: "#f0abfc", border: "#501a50" },
        Comparison: { bg: "#3a1f0a", color: "#fdba74", border: "#502a10" },
      };

      const TAG_BAR_COLOR = {
        Theory: "#7dd3fc",
        "Math / Proof": "#c4b5fd",
        Implement: "#86efac",
        "Debug / Diagnose": "#fca5a5",
        Design: "#fcd34d",
        "Explain Behavior": "#6ee7b7",
        Optimize: "#f0abfc",
        Comparison: "#fdba74",
      };

      const LEVELS = {
        L1: { label: "L1", range: [1, 35] },
        L2: { label: "L2", range: [36, 140] },
        L3: { label: "L3", range: [141, 280] },
        L4: { label: "L4", range: [281, 350] },
      };

      function getLevel(id) {
        if (id <= 35) return "L1";
        if (id <= 140) return "L2";
        if (id <= 280) return "L3";
        return "L4";
      }

      const QUESTIONS = [
        // SECTION 0: PyTorch Core & Internals (55)
        {
          id: 1,
          s: 0,
          tag: "Implement",
          text: "Implement a function that creates a 3D tensor from nested Python lists, computes its transpose along the last two dimensions, and verifies the result by checking shape and element-wise equality without using torch.transpose directly.",
        },
        {
          id: 2,
          s: 0,
          tag: "Explain Behavior",
          text: "Explain exactly what happens in memory when you call .view() versus .reshape() on a non-contiguous tensor in PyTorch. When does each succeed or fail, and why?",
        },
        {
          id: 3,
          s: 0,
          tag: "Implement",
          text: "Implement a custom broadcasting-aware element-wise multiplication function that accepts tensors of arbitrary compatible shapes, applies the operation, and prints the resulting shape and intermediate broadcast shapes at each step.",
        },
        {
          id: 4,
          s: 0,
          tag: "Explain Behavior",
          text: "Explain the difference between torch.Tensor.data and torch.Tensor.detach() and describe a scenario where using .data instead of .detach() leads to a silent correctness bug during training.",
        },
        {
          id: 5,
          s: 0,
          tag: "Implement",
          text: "Implement a function that manually computes the gradient of z = x² + 3xy + y³ with respect to x and y using PyTorch's autograd, then verify your result analytically.",
        },
        {
          id: 6,
          s: 0,
          tag: "Explain Behavior",
          text: "Explain what retain_graph=True does in .backward(), why it is needed in certain training loops, and what memory cost it incurs. Give a concrete use case such as multi-task learning.",
        },
        {
          id: 7,
          s: 0,
          tag: "Implement",
          text: "Implement a custom nn.Module called LinearWithBias that manually manages its weight and bias as nn.Parameter objects, implements forward(), and registers them so they appear in parameters() and state_dict().",
        },
        {
          id: 8,
          s: 0,
          tag: "Implement",
          text: "Implement a complete training loop for a two-layer MLP on a synthetic regression dataset, using SGD with momentum, including zero_grad(), forward pass, loss computation, .backward(), and optimizer step — all from scratch with no high-level wrappers.",
        },
        {
          id: 9,
          s: 0,
          tag: "Implement",
          text: "Write a full model checkpointing function that saves model state_dict, optimizer state_dict, current epoch, loss, and a random seed state to disk, and a corresponding restore function that resumes training exactly from that point.",
        },
        {
          id: 10,
          s: 0,
          tag: "Explain Behavior",
          text: "Explain PyTorch's computation graph lifecycle: when is a graph created, when is it freed, and what are the implications for memory management in a training loop that calls .backward() inside torch.no_grad()?",
        },
        {
          id: 11,
          s: 0,
          tag: "Implement",
          text: "Implement a custom autograd.Function for the SiLU (Sigmoid Linear Unit) activation, writing both the forward and backward static methods manually, including the analytic gradient formula.",
        },
        {
          id: 12,
          s: 0,
          tag: "Implement",
          text: "Implement a register_forward_hook that captures intermediate feature maps from every Conv2d layer in a given model, stores them in a dictionary keyed by layer name, and can be cleanly removed after a single forward pass.",
        },
        {
          id: 13,
          s: 0,
          tag: "Implement",
          text: "Implement a register_backward_hook that detects exploding gradients in any nn.Linear layer during backpropagation and logs the layer name and gradient norm when the norm exceeds a threshold.",
        },
        {
          id: 14,
          s: 0,
          tag: "Implement",
          text: "Implement a custom Dataset and DataLoader pipeline for a large image directory that does not fit in RAM, applying random crop, horizontal flip, and normalization transforms, with num_workers=4 and pin_memory=True.",
        },
        {
          id: 15,
          s: 0,
          tag: "Implement",
          text: "Write a custom collate_fn for a DataLoader that handles variable-length text sequences — padding them to the length of the longest sequence in the batch and returning both the padded tensor and a mask tensor.",
        },
        {
          id: 16,
          s: 0,
          tag: "Implement",
          text: "Implement a mixed precision training loop using torch.cuda.amp.autocast and GradScaler for a CNN classifier, including the scaler.scale(), scaler.step(), and scaler.update() calls in the correct order.",
        },
        {
          id: 17,
          s: 0,
          tag: "Explain Behavior",
          text: "Explain what GradScaler does under the hood in mixed precision training. What problem does it solve, how does it detect inf/nan gradients, and what does it do when an overflow is detected?",
        },
        {
          id: 18,
          s: 0,
          tag: "Implement",
          text: "Implement a function that moves a model and all its tensors to a target device, handles both CPU and CUDA targets, and verifies that every parameter and buffer is on the correct device afterward.",
        },
        {
          id: 19,
          s: 0,
          tag: "Theory",
          text: "Explain the difference between leaf tensors and non-leaf tensors in PyTorch's autograd system. Which tensors accumulate gradients in .grad, and why do non-leaf tensor gradients get freed by default after .backward()?",
        },
        {
          id: 20,
          s: 0,
          tag: "Implement",
          text: "Implement a gradient accumulation training loop that simulates a batch size of 512 using micro-batches of 32, accumulating gradients over 16 steps before calling optimizer.step() and zero_grad().",
        },
        {
          id: 21,
          s: 0,
          tag: "Implement",
          text: "Write a function that inspects a given nn.Module and prints a tree-structured summary of all submodules, their parameter counts, and total trainable versus frozen parameters.",
        },
        {
          id: 22,
          s: 0,
          tag: "Implement",
          text: "Implement a parameter freezing utility that accepts a model and a list of layer name prefixes, freezes all matching parameters by setting requires_grad=False, and confirms the freeze by checking optimizer parameter groups.",
        },
        {
          id: 23,

        },
        {

          tag: "Implement",
          text: "Implement a model weight diff tool: given two model checkpoints (pre and post fine-tuning), compute the L2 norm of weight changes per layer, identify which layers changed most, and visualize the change distribution.",
        },
        {
          id: 349,
          s: 10,
          tag: "Design",
          text: "Design a complete MLOps pipeline for a deep learning project: data versioning, model training with experiment tracking, automated evaluation, model registry, staging/production deployment, monitoring for data drift, and automated retraining triggers.",
        },
        {
          id: 350,
          s: 10,
          tag: "Implement",
          text: "Implement a custom CUDA-extension design exercise in PyTorch using torch.utils.cpp_extension: write a simple C++ extension that implements a fused bias+ReLU operation, compile it with CppExtension, and verify correctness against a pure PyTorch implementation.",
        },
      ];

      // State
      let activeSection = null;
      let activeTag = null;
      let search = "";
      let bookmarks = new Set(
        JSON.parse(localStorage.getItem("ptq_bookmarks") || "[]")
      );
      let completed = new Set(
        JSON.parse(localStorage.getItem("ptq_completed") || "[]")
      );
      let expanded = null;
      let showBookmarks = false;
      let showCompleted = false;
      let currentView = "questions";

      function save() {
        localStorage.setItem("ptq_bookmarks", JSON.stringify([...bookmarks]));
        localStorage.setItem("ptq_completed", JSON.stringify([...completed]));
      }

      function switchView(v) {
        currentView = v;
        document
          .getElementById("btn-q")
          .classList.toggle("active", v === "questions");
        document
          .getElementById("btn-s")
          .classList.toggle("active", v === "stats");
        document.getElementById("q-list").style.display =
          v === "questions" ? "flex" : "none";
        document.getElementById("q-count").style.display =
          v === "questions" ? "block" : "none";
        document.getElementById("filter-row").style.display =
          v === "questions" ? "flex" : "none";
        document.getElementById("stats-view").style.display =
          v === "stats" ? "block" : "none";
        document.getElementById("sidebar").style.display =
          v === "questions" ? "block" : "none";
        if (v === "stats") renderStats();
      }

      function setSection(i) {
        activeSection = i;
        render();
      }
      function setTag(t) {
        activeTag = activeTag === t ? null : t;
        render();
      }

      function getFiltered() {
        return QUESTIONS.filter((q) => {
          if (activeSection !== null && q.s !== activeSection) return false;
          if (activeTag !== null && q.tag !== activeTag) return false;
          if (showBookmarks && !bookmarks.has(q.id)) return false;
          if (showCompleted && !completed.has(q.id)) return false;
          if (search) {
            const s = search.toLowerCase();
            if (
              !q.text.toLowerCase().includes(s) &&
              !SECTIONS[q.s].toLowerCase().includes(s) &&
              !q.tag.toLowerCase().includes(s)
            )
              return false;
          }
          return true;
        });
      }

      function renderSidebar() {
        // sections
        const sl = document.getElementById("sec-list");
        const sa = document.getElementById("sec-all");
        sa.classList.toggle("active", activeSection === null);
        const doneBySection = {};
        completed.forEach((id) => {
          const q = QUESTIONS.find((q) => q.id === id);
          if (q) doneBySection[q.s] = (doneBySection[q.s] || 0) + 1;
        });
        const secCounts = {};
        QUESTIONS.forEach((q) => {
          secCounts[q.s] = (secCounts[q.s] || 0) + 1;
        });
        sl.innerHTML = "";
        SECTIONS.forEach((s, i) => {
          const done = doneBySection[i] || 0;
          const btn = document.createElement("button");
          btn.className =
            "sidebar-btn" + (activeSection === i ? " active" : "");
          btn.innerHTML = `<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s}</span><span class="count">${
            done ? `<span class="done-count">${done}/</span>` : ""
          }${secCounts[i]}</span>`;
          btn.onclick = () => setSection(activeSection === i ? null : i);
          sl.appendChild(btn);
        });

        // tags
        const tl = document.getElementById("tag-list");
        const tagCounts = {};
        QUESTIONS.forEach((q) => {
          tagCounts[q.tag] = (tagCounts[q.tag] || 0) + 1;
        });
        tl.innerHTML = "";
        TAGS.forEach((t) => {
          const style = TAG_STYLE[t];
          const btn = document.createElement("button");
          btn.className = "sidebar-btn" + (activeTag === t ? " active" : "");
          btn.style.cssText =
            activeTag === t
              ? `background:${style.bg};color:${style.color};border:1px solid ${style.border}`
              : "";
          btn.innerHTML = `<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span><span class="count">${tagCounts[t]}</span>`;
          btn.onclick = () => setTag(t);
          tl.appendChild(btn);
        });
      }

      function renderFilters() {
        const fr = document.getElementById("filter-row");
        fr.innerHTML = "";
        const bmkBtn = document.createElement("button");
        bmkBtn.className = "chip" + (showBookmarks ? " on" : "");
        bmkBtn.innerHTML = `🔖 Bookmarks${
          bookmarks.size ? " (" + bookmarks.size + ")" : ""
        }`;
        bmkBtn.onclick = () => {
          showBookmarks = !showBookmarks;
          render();
        };
        fr.appendChild(bmkBtn);

        const doneBtn = document.createElement("button");
        doneBtn.className = "chip" + (showCompleted ? " on" : "");
        doneBtn.innerHTML = `✓ Completed${
          completed.size ? " (" + completed.size + ")" : ""
        }`;
        doneBtn.onclick = () => {
          showCompleted = !showCompleted;
          render();
        };
        fr.appendChild(doneBtn);

        if (
          activeSection !== null ||
          activeTag !== null ||
          showBookmarks ||
          showCompleted ||
          search
        ) {
          const clr = document.createElement("button");
          clr.className = "chip clear";
          clr.innerHTML = "✕ Clear all";
          clr.onclick = () => {
            activeSection = null;
            activeTag = null;
            showBookmarks = false;
            showCompleted = false;
            search = "";
            document.getElementById("search").value = "";
            render();
          };
          fr.appendChild(clr);
        }
      }

      function renderProgress() {
        const pct = ((completed.size / 350) * 100).toFixed(1);
        document.getElementById("prog-fill").style.width = pct + "%";
        document.getElementById(
          "prog-label"
        ).textContent = `${completed.size} of 350 completed`;
        document.getElementById(
          "bmk-label"
        ).textContent = `${bookmarks.size} bookmarked`;
      }

      function renderQuestions() {
        const filtered = getFiltered();
        document.getElementById("q-count").textContent = `${
          filtered.length
        } question${filtered.length !== 1 ? "s" : ""}`;
        const list = document.getElementById("q-list");
        list.innerHTML = "";
        filtered.forEach((q) => {
          const isExp = expanded === q.id;
          const isDone = completed.has(q.id);
          const isBmk = bookmarks.has(q.id);
          const level = getLevel(q.id);
          const ts = TAG_STYLE[q.tag];

          const card = document.createElement("div");
          card.className = "q-card" + (isDone ? " done" : "");

          const hdr = document.createElement("div");
          hdr.className = "q-header";
          hdr.onclick = () => {
            expanded = isExp ? null : q.id;
            renderQuestions();
          };

          hdr.innerHTML = `
      <span class="q-num">${q.id}.</span>
      <div class="q-body">
        <div class="q-tags">
          <span class="tag-pill" style="background:${ts.bg};color:${
            ts.color
          };border:1px solid ${ts.border}">${q.tag}</span>
          <span class="sec-pill">${SECTIONS[q.s]}</span>
          <span class="lvl-pill">${level}</span>
        </div>
        <p class="q-text${isExp ? " expanded" : ""}">${q.text}</p>
      </div>
      <div class="q-actions">
        <button class="icon-btn bmk${
          isBmk ? " on" : ""
        }" title="Bookmark" onclick="event.stopPropagation();toggleBmk(${
            q.id
          })">${isBmk ? "🔖" : "🏷️"}</button>
        <button class="icon-btn done-btn${
          isDone ? " on" : ""
        }" title="Mark complete" onclick="event.stopPropagation();toggleDone(${
            q.id
          })">${isDone ? "✅" : "⬜"}</button>
      </div>
    `;
          card.appendChild(hdr);
          list.appendChild(card);
        });
      }

      function toggleBmk(id) {
        bookmarks.has(id) ? bookmarks.delete(id) : bookmarks.add(id);
        save();
        render();
      }
      function toggleDone(id) {
        completed.has(id) ? completed.delete(id) : completed.add(id);
        save();
        render();
      }

      function renderStats() {
        const sv = document.getElementById("stats-view");
        const secCounts = {};
        QUESTIONS.forEach((q) => {
          secCounts[q.s] = (secCounts[q.s] || 0) + 1;
        });
        const doneBySection = {};
        completed.forEach((id) => {
          const q = QUESTIONS.find((q) => q.id === id);
          if (q) doneBySection[q.s] = (doneBySection[q.s] || 0) + 1;
        });
        const tagCounts = {};
        QUESTIONS.forEach((q) => {
          tagCounts[q.tag] = (tagCounts[q.tag] || 0) + 1;
        });
        const pct = Math.round((completed.size / 350) * 100);

        sv.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">TOTAL</div><div class="stat-value">350</div></div>
      <div class="stat-card"><div class="stat-label">COMPLETED</div><div class="stat-value green">${
        completed.size
      }</div></div>
      <div class="stat-card"><div class="stat-label">BOOKMARKED</div><div class="stat-value">${
        bookmarks.size
      }</div></div>
      <div class="stat-card"><div class="stat-label">PROGRESS</div><div class="stat-value green">${pct}%</div></div>
    </div>
    <div class="section-card">
      <h3>// progress by section</h3>
      ${SECTIONS.map((s, i) => {
        const total = secCounts[i] || 0;
        const done = doneBySection[i] || 0;
        const p = total ? Math.round((done / total) * 100) : 0;
        return `<div class="prog-row">
          <div class="prog-label"><span class="prog-name">${s}</span><span class="prog-nums">${done}/${total}</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${p}%"></div></div>
        </div>`;
      }).join("")}
    </div>
    <div class="tag-card">
      <h3>// questions by type</h3>
      ${TAGS.map((tag) => {
        const count = tagCounts[tag] || 0;
        const p = Math.round((count / 350) * 100);
        return `<div class="tag-row">
          <div style="width:10px;height:10px;border-radius:2px;background:${TAG_BAR_COLOR[tag]};flex-shrink:0"></div>
          <span class="tag-name">${tag}</span>
          <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${p}%;background:${TAG_BAR_COLOR[tag]}"></div></div>
          <span class="tag-num">${count}</span>
        </div>`;
      }).join("")}
    </div>
  `;
      }

      function render() {
        renderProgress();
        renderSidebar();
        renderFilters();
        renderQuestions();
      }

      document.getElementById("search").addEventListener("input", (e) => {
        search = e.target.value;
        render();
      });

      render();
    </script>
  </body>
</html>
